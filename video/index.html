<script>
// 获取所有筛选按钮、影片卡片
const filterBtns = document.querySelectorAll('.tag-filter-btn');
const movieCards = document.querySelectorAll('.movie-card');
const sectionWraps = document.querySelectorAll('.section-wrap');

filterBtns.forEach(btn => {
  btn.addEventListener('click', function () {
    // 清除所有按钮激活状态
    filterBtns.forEach(b => b.classList.remove('active'));
    // 当前按钮激活
    this.classList.add('active');
    const selectTag = this.getAttribute('data-tag');

    // 遍历卡片筛选
    movieCards.forEach(card => {
      // 防止没有data-tags时报错
      const tagsStr = card.getAttribute('data-tags') || '';
      const cardTags = tagsStr.split(',');
      if (selectTag === 'all' || cardTags.includes(selectTag)) {
        card.classList.remove('hide-card');
      } else {
        card.classList.add('hide-card');
      }
    })

    // 新增：判断每个板块，如果卡片全部隐藏，就隐藏整个板块标题
    sectionWraps.forEach(section => {
      const cardsInSection = section.querySelectorAll('.movie-card');
      const visibleCards = Array.from(cardsInSection).filter(c => !c.classList.contains('hide-card'));
      if(visibleCards.length === 0){
        section.classList.add('hide-section');
      }else{
        section.classList.remove('hide-section');
      }
    })
  })
})
