    (() => {
      
    const saveToLocal = {
      set: (key, value, ttl) => {
        const data = { value }

        if (ttl != null) {
          data.expiry = Date.now() + ttl * 86400000
        }

        localStorage.setItem(key, JSON.stringify(data))
      },
      get: key => {
        const itemStr = localStorage.getItem(key)
        if (!itemStr) return

        try {
          const data = JSON.parse(itemStr)

          if (data.expiry && Date.now() > data.expiry) {
            localStorage.removeItem(key)
            return
          }

          return data.value
        } catch {
          localStorage.removeItem(key)
        }
      }
    }

    const scriptCache = new Map()
    const cssCache = new Map()
    window.btf = {
      saveToLocal,
      getScript: (url, attr = {}) => {
        if (scriptCache.has(url)) {
          return scriptCache.get(url)
        }

        const promise = new Promise((resolve, reject) => {
          const script = document.createElement('script')

          script.src = url
          script.async = true

          for (const key in attr) {
            script.setAttribute(key, attr[key])
          }

          script.onload = resolve
          script.onerror = reject

          document.head.appendChild(script)
        })

        scriptCache.set(url, promise)

        return promise
      },
      getCSS: (url, id) => {
        if (cssCache.has(url)) {
          return cssCache.get(url)
        }

        const promise = new Promise((resolve, reject) => {
          const link = document.createElement('link')

          link.rel = 'stylesheet'
          link.href = url

          if (id) {
            link.id = id
          }

          link.onload = resolve
          link.onerror = reject

          document.head.appendChild(link)
        })

        cssCache.set(url, promise)

        return promise
      },
      addGlobalFn: (key, fn, name = false, parent = window) => {
        if (!false && key.startsWith('pjax')) return
        const globalFn = parent.globalFn || {}
        globalFn[key] = globalFn[key] || {}
        globalFn[key][name || Object.keys(globalFn[key]).length] = fn
        parent.globalFn = globalFn
      }
    }
  
      
      const metaThemeColor = document.querySelector('meta[name="theme-color"]')
      const activateDarkMode = () => {

      const activateLightMode = () => {

      }

      btf.activateDarkMode = activateDarkMode

      const theme = saveToLocal.get('theme')

<div id="travelMap"></div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(()=>{
    // =========【只在这里修改颜色】=========
    const visitedColor = "#a3d8f7"; // 已去过打卡点
    const planColor = "#f7c2e9";    // 计划打卡点

    const map = L.map('travelMap').setView([32, 112], 5);

    // ========== 高德底图图层 ==========
    const vecLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains: ['1','2','3','4'],
      attribution: '&copy; 高德地图 矢量图',
      maxZoom: 19,
      minZoom: 1
    });

    const imgBase = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=6&x={x}&y={y}&z={z}', {
      subdomains: ['1','2','3','4'],
      attribution: '&copy; 高德影像底图',
      maxZoom: 17,
      minZoom: 1
    });

    const imgLabel = L.tileLayer('http://wprd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=8&x={x}&y={y}&z={z}', {
      subdomains: ['1','2','3','4'],
      attribution: '&copy; 高德影像注记',
      maxZoom: 17,
      minZoom: 1
    });
    imgLabel.setOpacity(0.82);

    const imgFull = L.layerGroup([imgBase, imgLabel]);
    vecLayer.addTo(map);

    const baseLayers = {
      "矢量图": vecLayer,
      "影像图": imgFull
    };

    L.control.layers(baseLayers, null, {
      collapsed: false
    }).addTo(map);


    // ===== 标准定位针图标（无旋转，不会变形）：已去过 =====
    const visitedIcon = L.divIcon({
      className: 'pin-icon',
      html: `
      <svg width="28" height="36" viewBox="0 0 28 36">
        <path fill="${visitedColor}" stroke="#fff" stroke-width="3" d="M14,2 C7,2 2,7 2,14 C2,22 14,34 14,34 C14,34 26,22 26,14 C26,7 21,2 14,2 Z" />
        <circle cx="14" cy="14" r="4" fill="#ffffff"/>
      </svg>`,
      iconSize: [28, 36],
      iconAnchor: [14, 36]
    });

    // ===== 标准定位针图标（无旋转，不会变形）：计划 =====
    const planIcon = L.divIcon({
      className: 'pin-icon',
      html: `
      <svg width="28" height="36" viewBox="0 0 28 36">
        <path fill="${planColor}" stroke="#fff" stroke-width="3" d="M14,2 C7,2 2,7 2,14 C2,22 14,34 14,34 C14,34 26,22 26,14 C26,7 21,2 14,2 Z" />
        <circle cx="14" cy="14" r="4" fill="#ffffff"/>
      </svg>`,
      iconSize: [28, 36],
      iconAnchor: [14, 36]
    });


    // ========== 已打卡点位【name,坐标,描述,文章url】 ==========
    const checkPoints = [
      {
        coord: [29.56,106.55],
        name:"重庆",
        desc:"2024国庆 | 山城，洪崖洞、长江索道",
        url:"/posts/chongqing/"
      },
      {
        coord: [31.23,121.47],
        name:"上海",
        desc:"2023暑假 | 外滩，迪士尼",
        url:"/posts/shanghai/"
      },
      {
        coord: [22.54,114.06],
        name:"深圳",
        desc:"2025春节",
        url:"/posts/shenzhen/"
      }
    ];

    const markers = [];

    checkPoints.forEach(item=>{
      // target="_blank" 新标签打开游记笔记
      const popupHtml = `<b><a href="${item.url}" target="_blank">${item.name}</a></b><br>${item.desc}`;
      let m = L.marker(item.coord, {icon: visitedIcon}).addTo(map)
        .bindPopup(popupHtml);
      markers.push(m);
    });

    // ========== 旅行轨迹连线 ==========
    const routeLine = [
      [29.56,106.55],
      [30.27,120.15],
      [31.23,121.47]
    ];

    const polyline = L.polyline(routeLine, {
      color: visitedColor,
      weight: 4,
      opacity: 0.7
    }).addTo(map);

    // ========== 计划打卡点 ==========
    const planPoints = [
      {
        coord:[25.04,102.71],
        name:"昆明",
        desc:"计划2027寒假 | 云南旅行",
        url:"/posts/kunming/"
      }
    ];

    planPoints.forEach(item=>{
      const popupHtml = `<b><a href="${item.url}" target="_blank">${item.name}</a></b><br>${item.desc}`;
      L.marker(item.coord, {icon: planIcon}).addTo(map)
        .bindPopup(popupHtml);
    });

    // ========== 地图自动适配边界 ==========
    const allLayerGroup = L.featureGroup([...markers, polyline]);
    map.fitBounds(allLayerGroup.getBounds(), {
      padding: [40, 40],
      maxZoom: 11
    });

    map.invalidateSize();

  }, 200);
});
